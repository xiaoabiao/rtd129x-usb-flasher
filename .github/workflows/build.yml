name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (windows)
    runs-on: windows-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Unit tests
        # The USB backend needs a board, so the test suite runs without it; the
        # protocol/image/factory logic is all exercised by the mock backend.
        run: cargo test --workspace

      - name: Build release binaries
        run: |
          cargo build --release -p rtd-cli --features usb
          cargo build --release -p rtd-gui --features usb,screenshot

      - name: Determine version
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $v = $env:GITHUB_REF -replace '^refs/tags/v', ''
          } else {
            $v = '1.0.' + $env:GITHUB_RUN_NUMBER
          }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "version = $v"

      - name: Package installer + portable zip
        shell: pwsh
        run: |
          ./packaging/build-installer.ps1 -Version '${{ steps.ver.outputs.version }}'

      - name: Show artifacts
        shell: pwsh
        run: Get-ChildItem dist | Format-Table Name, @{n='MB';e={[math]::Round($_.Length/1MB,2)}}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rtd-flasher-${{ steps.ver.outputs.version }}
          path: |
            dist/*.exe
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Create release (tag push only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true
